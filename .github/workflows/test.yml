name: test

# 每次推 main 与每个 PR 都跑。
#
# 三道核心守卫的顺序不能换:
#   1 测试与检查数 → 2 双语配对哈希 → 3 文档数字复核
# （参考仓真的因为「改了数字忘重录配对哈希」让四条矩阵全红过一次。）
#
# 另有守卫 4/5（shell 语法、版本一致性）与**守卫 6（真装真启动）**。
# 守卫 6 是唯一能抓「插件装得上但起不来」的检查，见文件末尾那一步的注释。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 20 是保守下限(本包只用标准库),24 是当前开发版本。
        node-version: ['20', '24']
        dsh: ['0.1.6-alpha.2']
        include:
          # Windows 是最容易出差异的平台:路径分隔符、symlink 权限、junction/链接形态都不同。
          # 本插件要在 Windows 与 WSL 两侧工作,所以 Windows 必须在矩阵里。
          - os: windows-latest
            node-version: '24'
            dsh: '0.1.6-alpha.2'
          # 实测过的稳定线(桌面版 harness 用的就是它)。
          - os: ubuntu-latest
            node-version: '24'
            dsh: '0.1.5-rc.2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 本包的测试**不需要**安装 dsh:lib/ 是纯 Node 模块,套件自己造工作区。
      # 这一条只做语法自检,防止"本地没跑到的文件"进主干。
      - name: 语法检查(lib / test / tools)
        shell: bash
        run: |
          set -e
          for f in lib/*.js test/*.mjs tools/*.mjs; do node --check "$f"; done

      - name: 守卫 1/3 — 测试与检查数
        run: node test/run.mjs

      - name: 守卫 2/3 — 双语配对哈希
        run: node tools/verify-translation-pairing.mjs

      - name: 守卫 3/3 — 文档数字 vs 真实运行
        run: node tools/verify-doc-numbers.mjs

      - name: 版本一致性(声明的 dsh 区间必须覆盖本矩阵这条 dsh)
        run: node tools/verify-version-consistency.mjs --dsh ${{ matrix.dsh }}

      - name: shell 语法
        shell: bash
        run: bash -n install.sh && bash -n uninstall.sh

      - name: 打包清单与 files 白名单一致
        shell: bash
        run: |
          set -e
          # 先在 shell 里出 JSON,再交给 node 解析。
          # 不要在 node 里 execFileSync('npm', …):Windows 上 npm 是 npm.cmd,
          # 无 shell 直接 spawn 会 ENOENT —— CI 实测踩到过。
          npm pack --dry-run --json > packlist.json
          node -e "
          const manifest = require('./package.json');
          const files = require('./packlist.json')[0].files.map((f) => f.path);
          const required = ['package.json', 'cordis.patch.yml', 'lib/index.js', 'install.sh', 'uninstall.sh', 'AGENTS.md', 'README.md', 'README.zh.md'];
          const missing = required.filter((f) => !files.includes(f));
          if (missing.length > 0) { console.error('packlist 缺少: ' + missing.join(', ')); process.exit(1); }
          if (files.some((f) => f.startsWith('node_modules/') || f.startsWith('.git/'))) { console.error('packlist 混入了不该发布的目录'); process.exit(1); }
          console.log('packlist OK: ' + files.length + ' 个文件, 包版本 ' + manifest.version);
          "
          rm -f packlist.json

      # ── 守卫 6：真装真启动 ────────────────────────────────────────────
      # 上面五道跑的都是纯逻辑与配置，**没有一道把插件真装进一个 harness 里跑一遍**。
      # 这条缝是真的：1.0.0 装得上、73 项单测全绿、`--dump-config` exit 0 / stderr 0 字节 /
      # 571 行合成树 —— 然后启动时把整个 profile 打下来，因为 cordis.patch.yml 的行 `name`
      # 还写着改名前的旧包名：
      #
      #   Cannot find package 'dsh-workspace-rewind' imported from …/profiles/web/
      #
      # `--dump-config` 只**合成**配置、从不 apply 插件，所以它对一个起不来的 profile
      # 报告了一棵干净的树（行名是否解析得到，在 dump 里不留任何痕迹）。
      # 只有真 `--port` 启动能验这一条 —— 所以 CI 必须自己起一次。
      - name: 安装 pnpm（`dsh plugin add` 会转调它，dsh 不自带）
        run: npm install -g pnpm@12.4.2

      - name: 为守卫 6 安装 harness（跑完即弃，不进 package.json）
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}

      - name: 守卫 6 — 真装真启动（本仓库唯一能抓「装不上」的检查）
        run: node tools/verify-boot.mjs --port 31860
